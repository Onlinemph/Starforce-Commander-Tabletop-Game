name: Deploy match service

# Deploys server/ (the online-match Worker) to Cloudflare, so the whole
# deployment can be driven from a browser — no terminal needed. It requires
# two repository secrets, both created from the Cloudflare dashboard:
#
#   CLOUDFLARE_API_TOKEN   an API token made from the "Edit Cloudflare
#                          Workers" template
#   CLOUDFLARE_ACCOUNT_ID  shown on the dashboard's Workers & Pages overview
#
# Until the secrets exist the deploy step skips itself rather than failing,
# so this workflow is safe to keep on every branch.
on:
  workflow_dispatch:
  push:
    paths: ['server/**']

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Explain the missing secrets, if they are missing
        if: ${{ env.CF_TOKEN == '' || env.CF_ACCOUNT == '' }}
        run: |
          echo "::notice::Skipped — add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets (Settings → Secrets and variables → Actions) and run this workflow again."

      - name: Deploy to Cloudflare Workers
        if: ${{ env.CF_TOKEN != '' && env.CF_ACCOUNT != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server

      # The deploy log above ends with the service URL, something like
      # https://sfc-matches.<your-subdomain>.workers.dev — that is what goes
      # in the game's Online panel, in the "Match server" field.
