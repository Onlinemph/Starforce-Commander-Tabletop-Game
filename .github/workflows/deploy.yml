name: Deploy to GitHub Pages

# The app is a static build with no server, so publishing it is just uploading
# `dist/`. Enable Pages for the repository once, with "Source: GitHub Actions",
# and every push to the default branch republishes.
on:
  push:
    # Every branch triggers, but only the repository's default branch actually
    # publishes — see the `if` on the build job. Naming branches here instead
    # would silently stop working the moment the default branch is renamed, or
    # when a repository has no `main` at all.
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@v4

      # If Pages is still set to "Deploy from a branch", GitHub *also* runs its
      # legacy Jekyll pipeline on every push. That one publishes the repository
      # source, finishes a few seconds after this workflow, and silently
      # overwrites the real build — so the site loads and does nothing. Both
      # runs go green, which makes it a genuinely nasty thing to debug. Fail
      # here instead, with the fix in the message.
      - name: Check the Pages source is set to GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null); then
            echo "::warning::Could not read the Pages configuration; continuing."
            exit 0
          fi
          if [ "$build_type" != "workflow" ]; then
            echo "::error::GitHub Pages is set to '$build_type', not 'workflow'. Its legacy Jekyll pipeline will overwrite this deploy with the unbuilt source. Fix: Settings -> Pages -> Source -> GitHub Actions."
            exit 1
          fi
          echo "Pages source is GitHub Actions."

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        # A project site is served from /<repo-name>/, so the asset paths have
        # to be built for that prefix. Taken from the repository itself, so a
        # fork or a rename needs no edit here.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # The match service every visitor's Online panel starts with, so
          # nobody has to paste anything. Set these as repository *variables*
          # (Settings → Secrets and variables → Actions → Variables) — not
          # secrets: they are meant to reach the browser, which is exactly
          # what a Supabase anon key is for.
          #
          # Supabase (see supabase/README.md): SUPABASE_URL + SUPABASE_ANON_KEY
          # Worker service (see server/README.md): MATCH_SERVER
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          # Either name works: Supabase's Connect dialog calls it a
          # publishable key now, older projects call it the anon key.
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
          VITE_MATCH_SERVER: ${{ vars.MATCH_SERVER }}
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
